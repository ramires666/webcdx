name: Local release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-release-required:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.6'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Verify compiled local bundle and existing Gate compatibility
        shell: pwsh
        run: ./ai-studio-extension/verify-release.ps1
      - name: Verify AI Studio local-only entry point
        shell: pwsh
        run: |
          go test -tags aistudio ./cmd/agent ./internal/buildinfo ./internal/protocol
          ./build.ps1
          $env:WEBCODEX_TEST_AGENT_PATH = Join-Path $pwd 'bin/aix/webcodex-agent.exe'
          $env:WEBCODEX_AIX_LOCAL_ONLY = '1'
          $env:WEBCODEX_LOCAL_REAL_TEST = '1'
          node --test ai-studio-extension/real-local.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Local-only bundle test failed' }
      - name: Verify local OpenCode subagent workflow
        shell: pwsh
        run: ./tools/test-subagents.ps1
