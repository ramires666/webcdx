# Nginx configuration for WebCodex Gate on codex.grom.world
# Place in /etc/nginx/sites-available/codex.grom.world (or /etc/nginx/conf.d/codex.grom.world.conf)
# and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name codex.grom.world;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codex.grom.world;

    # SSL Certificates (e.g. from Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/codex.grom.world/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/codex.grom.world/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:38971;
        proxy_http_version 1.1;

        # WebSocket / Long-lived Stream headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Disable buffering for NDJSON (/agent/stream) and SSE (/mcp) streams
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeout for idle agent streams; individual MCP calls are limited by Gate.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
