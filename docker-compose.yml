services:
  gate:
    build:
      context: .
      dockerfile: Dockerfile.gate
    container_name: webcodex-gate
    restart: unless-stopped
    environment:
      WEBCODEX_ADDR: ":38971"
      WEBCODEX_PUBLIC_URL: "https://${MCP_DOMAIN:-codex.grom.world}"
      WEBCODEX_DB_PATH: "/data/webcodex.db"
      WEBCODEX_ADMIN_USER: "${WEBCODEX_ADMIN_USER:-admin}"
      WEBCODEX_ADMIN_PASSWORD: "${WEBCODEX_ADMIN_PASSWORD}"
      WEBCODEX_CALL_TIMEOUT: "60s"
      WEBCODEX_ACCESS_TOKEN_TTL: "24h"
    volumes:
      - webcodex_data:/data
    ports:
      - "38971:38971"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:38971/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webcodex_data:
    driver: local
