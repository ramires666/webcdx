<!doctype html><html lang="ru"><meta charset="utf-8"><title>WebCodex Browser</title>
<style>:root{color-scheme:dark}body{font:14px system-ui;min-width:330px;padding:1rem;background:#0f172a;color:#f8fafc}button{font:inherit;margin:.3rem;padding:.5rem}label{display:block;margin:.7rem 0}#status{white-space:pre-wrap;word-break:break-word}</style>
<body><h1>WebCodex</h1><p>Текст и скриншоты подключённых вкладок проходят через ваш Gate в чат. Cookies и пароли не экспортируются.</p>
<label>????????? ??????? <input type="text" id="alias" maxlength="64" placeholder="chrome-linkedin"></label>
<label><input type="checkbox" id="continuous"> Постоянный доступ ко всем вкладкам сайтов</label>
<p>Включите один раз: Chrome и агент будут подключаться автоматически. Пауза и отключение доступны ниже.</p>
<label><input type="checkbox" id="public" checked> Переходы на HTTP/HTTPS сайты в выбранной вкладке</label>
<label><input type="checkbox" id="new"> Разрешить создавать новые вкладки и popup</label>
<button id="attach">Только текущая вкладка</button><button id="pause">Пауза</button><button id="resume">Продолжить</button><button id="disconnect">Отключить всё</button>
<p id="status" role="status"></p><script src="popup.js"></script></body></html>
